<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Universal Volume Guard</title>
  <style>
    body {
      font-family: sans-serif;
      width: 250px;
      padding: 10px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    label {
      font-weight: bold;
    }
    #loudness-value {
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h3>Universal Volume Guard</h3>
  <div class="control-row">
    <label for="enabled-checkbox">Enabled</label>
    <input type="checkbox" id="enabled-checkbox">
  </div>
  <div class="control-row">
    <label for="loudness-slider">Target Loudness</label>
    <span id="loudness-value">-16 LUFS</span>
  </div>
  <!-- The slider is disabled by default for the free version. -->
  <!-- A premium check would enable this. -->
  <input type="range" id="loudness-slider" min="-30" max="-6" value="-16" step="1" disabled>
  <small>Custom loudness is a Premium feature.</small>

  <script src="popup.js"></script>
</body>
</html>
