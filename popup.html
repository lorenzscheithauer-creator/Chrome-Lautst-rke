<!DOCTYPE html>
<html>
<head>
  <title>Volume Guard</title>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --font-color: #172b4d;
      --primary-color: #0052cc;
      --switch-bg: #dfe1e6;
      --border-color: #c1c7d0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 280px;
      padding: 15px;
      background-color: var(--bg-color);
      color: var(--font-color);
    }
    h3 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--primary-color);
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    label {
      font-size: 14px;
    }
    #loudnessValue {
      font-weight: bold;
      background-color: #e9ecef;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h3>Universal Volume Guard</h3>
  <div class="control-row">
    <label for="enableSwitch">Normalization Active</label>
    <input type="checkbox" id="enableSwitch">
  </div>

  <div class="control-row">
    <label for="loudnessSlider">Target Loudness</label>
    <span id="loudnessValue">-16 LUFS</span>
  </div>
  <input type="range" id="loudnessSlider" min="-24" max="-8" step="1" style="width: 100%;">

  <script src="popup.js"></script>
</body>
</html>
